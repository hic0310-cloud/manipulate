<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#102d3a">
<title>표류일지 — Ocean Drift v0.6</title>
<style>
:root{--bg:#102d3a;--panel:#173f4cf2;--edge:#956b42;--gold:#f4c66a;--ink:#f8edcf;--muted:#b8d0cc}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#071923;color:var(--ink);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;image-rendering:pixelated;overflow:hidden}.game{position:relative;width:100%;height:100dvh;overflow:hidden;background:#187c91}.top{position:absolute;z-index:5;top:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 10px;background:linear-gradient(#09232beF,#09232b99,transparent);pointer-events:none}.top>*{pointer-events:auto}.brand{font-weight:900;font-size:clamp(14px,2vw,22px);color:var(--gold);text-shadow:2px 2px #69452a;white-space:nowrap}.day{font-size:10px;color:#e1efdf;margin-top:2px}.topright{display:flex;align-items:center;gap:6px}.topbtn{background:#102f3cdd;border:1px solid #9f8a5d;color:#fff1ce;border-radius:6px;padding:7px 9px;font:inherit;font-size:12px}.meters{position:absolute;z-index:4;top:57px;left:10px;display:grid;grid-template-columns:repeat(2,minmax(88px,116px));gap:4px;pointer-events:none}.meter{font-size:10px;white-space:nowrap;background:#092b35d9;border:1px solid #72949a;border-radius:5px;padding:4px 6px;box-shadow:0 2px 5px #00141b66}.meter b{color:var(--gold)}.bar{height:4px;background:#09232d;margin-top:3px;border:1px solid #5c7a80}.fill{height:100%;background:#83d6a0}.fill.warn{background:#f2bb58}.fill.low{background:#ee7464}main{position:absolute;inset:0;min-height:0;display:block;padding:0}.scene-wrap{position:absolute;inset:0;min-height:0;border:0;background:#187c91;overflow:hidden;box-shadow:none}canvas{display:block;width:100%;height:100%;image-rendering:pixelated;touch-action:none}.side{position:absolute;z-index:8;right:10px;top:64px;bottom:78px;width:min(310px,88vw);display:none;flex-direction:column;gap:7px;min-height:0;overflow:auto;padding:8px;border:2px solid var(--edge);border-radius:9px;background:#0b2632ed;box-shadow:0 8px 28px #00151dcc}.side.open{display:flex}.panel{border:1px solid #8c7653;background:var(--panel);border-radius:6px;padding:9px;box-shadow:inset 0 0 0 1px #d4a66b22}.panel h3{margin:0 0 8px;font-size:12px;color:var(--gold)}.log{font-size:10px;line-height:1.5;overflow:auto;flex:1;min-height:50px;color:var(--muted);max-height:120px}.log p{margin:0 0 5px}.buttons{position:absolute;z-index:6;bottom:0;left:0;right:0;display:flex;justify-content:center;flex-wrap:wrap;gap:5px;padding:8px 8px max(8px,env(safe-area-inset-bottom));background:linear-gradient(transparent,#082630eF 28%);border:0}.btn{background:#795432eF;color:#fff1ce;border:1px solid #c99b5e;border-bottom-width:3px;border-radius:5px;padding:9px 9px;font:inherit;font-size:11px;cursor:pointer;box-shadow:0 2px 5px #00151d66}.btn:active{transform:translateY(2px);border-bottom-width:1px}.btn.primary{background:#1c6873;border-color:#65b9bd}.btn:disabled{opacity:.4;filter:grayscale(1)}.statusrow{font-size:11px;margin:7px 0}.statusrow .label{display:flex;justify-content:space-between}.hint{font-size:10px;line-height:1.5;color:var(--muted)}.tabrow{display:flex;gap:5px}.tabrow .btn{flex:1}.hidden{display:none!important}.toast{position:absolute;left:50%;top:112px;transform:translateX(-50%);background:#0b2632ee;border:2px solid var(--gold);border-radius:6px;padding:8px 12px;font-size:12px;z-index:10;max-width:88%;text-align:center;box-shadow:0 3px 12px #00151d88}.touchpad{position:absolute;z-index:5;bottom:72px;left:10px;display:grid;grid-template-columns:repeat(3,35px);gap:3px;opacity:.92}.touchpad button{height:32px;padding:0;background:#173f4ccc;border:1px solid #9db8a7;border-radius:4px;color:white;font-size:15px}.touchpad button:nth-child(1){grid-column:2}.touchpad button:nth-child(2){grid-column:1;grid-row:2}.touchpad button:nth-child(3){grid-column:2;grid-row:2}.touchpad button:nth-child(4){grid-column:3;grid-row:2}.meters .meter{backdrop-filter:blur(3px)}
@media(max-width:700px){.top{padding:7px;align-items:flex-start}.brand{font-size:15px}.day{font-size:9px}.meters{top:52px;left:7px;grid-template-columns:repeat(2,minmax(78px,98px));gap:3px}.meter{font-size:9px;padding:3px 5px}.side{top:100px;bottom:76px;right:6px;width:min(285px,90vw)}.buttons{gap:4px;padding:6px 5px max(7px,env(safe-area-inset-bottom))}.btn{font-size:10px;padding:8px 7px}.touchpad{left:7px;bottom:76px}.toast{top:104px;font-size:11px}}
@media(orientation:landscape) and (max-height:500px){.meters{top:49px;grid-template-columns:repeat(4,minmax(72px,92px))}.meter{font-size:9px}.side{top:50px;bottom:57px}.buttons{padding:4px 8px}.btn{padding:6px 8px}.touchpad{bottom:55px}.toast{top:88px}}
</style></head><body>
<div class="game"><header class="top"><div><div class="brand">🪵 표류일지</div><div class="day" id="dayline">DAY 1 · 08:00 · 적응기</div></div><div class="topright"><button class="topbtn" id="viewToggle">🌊 바다로</button><button class="topbtn" id="menuToggle">☰ 메뉴</button></div></header>
<main><section class="scene-wrap"><canvas id="scene" width="800" height="500" aria-label="게임 화면"></canvas><div class="meters" id="meters"></div><div id="toast" class="toast hidden"></div><div class="touchpad" id="touchpad"><button data-move="up">▲</button><button data-move="left">◀</button><button data-move="down">▼</button><button data-move="right">▶</button></div></section>
<aside class="side" id="sidePanel"><div class="panel"><h3 id="viewtitle">뗏목 생활</h3><div class="tabrow"><button class="btn primary" id="raftTab">뗏목뷰</button><button class="btn" id="seaTab">바다뷰</button></div><p class="hint" id="viewhint">뗏목 위를 움직이며 표류물을 정리하고 생활 기반을 만드세요.</p></div>
<div class="panel"><h3>🎒 소지품</h3><div id="inventory" class="hint"></div></div>
<div class="panel"><h3>🛠️ 제작 / 행동</h3><div id="actions" style="display:grid;gap:5px"></div></div>
<div class="panel" style="flex:1;min-height:0;display:flex;flex-direction:column"><h3>📜 표류 일지</h3><div class="log" id="log"></div></div></aside></main>
<footer class="buttons"><button class="btn" id="eatBtn">🍲 먹기</button><button class="btn" id="drinkBtn">💧 물 마시기</button><button class="btn" id="restBtn">🛏️ 휴식</button><button class="btn" id="collectBtn">🧲 주변 수집</button><button class="btn" id="buildBtn">🔨 시설 건설</button><button class="btn primary" id="saveBtn">💾 저장</button></footer></div>
<script>
(()=>{'use strict';
const canvas=document.getElementById('scene'),ctx=canvas.getContext('2d');ctx.imageSmoothingEnabled=false;
const $=id=>document.getElementById(id);let view='raft', tick=0, last=0, toastTimer, player={x:400,y:270}, raftSize=1, hazardClock=0, dangerFlash=0, jellyClock=0;
const state={day:1,time:8,health:100,hunger:88,thirst:86,mood:82,inventory:{wood:5,plastic:3,rope:2,scrap:1,fish:1,water:1},built:{purifier:false,grill:false,bed:false,shade:false,planter:false,aquarium:false},gear:{hammer:{durability:12,max:12},spear:{durability:0,max:0},wetsuit:{durability:0,max:0}},poison:0,log:[]};
const names={wood:'나무판자',plastic:'플라스틱',rope:'로프',scrap:'금속 조각',fish:'생선',water:'깨끗한 물',food:'요리',egg:'알'};
const debris=[{x:270,y:125,k:'wood',n:2},{x:360,y:195,k:'plastic',n:2},{x:545,y:145,k:'rope',n:1},{x:650,y:235,k:'scrap',n:1},{x:240,y:320,k:'plastic',n:1},{x:450,y:385,k:'wood',n:1},{x:700,y:115,k:'scrap',n:1},{x:570,y:315,k:'rope',n:1}];
const itemInfo={wood:{icon:'🪵',label:'나무판자',color:'#d6a05d'},plastic:{icon:'🧴',label:'플라스틱',color:'#a9e3e9'},rope:{icon:'🪢',label:'로프',color:'#e8d39b'},scrap:{icon:'⚙️',label:'금속 조각',color:'#c6d0d0'}};
// 해양 위험 생물: 상어는 플레이어를 추적하고, 범고래는 경고 후 돌진한다.
const threats={shark:{x:650,y:390,active:true,cooldown:0},orca:{x:720,y:90,active:false,cooldown:0,windup:0},jelly:{x:500,y:260,cooldown:0}};
function say(s){state.log.unshift(`DAY ${state.day}: ${s}`);state.log=state.log.slice(0,18);renderLog();showToast(s)}function showToast(s){$('toast').textContent=s;$('toast').classList.remove('hidden');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').classList.add('hidden'),1800)}
function add(k,n=1){state.inventory[k]=(state.inventory[k]||0)+n}function spend(cost){for(const k in cost)if((state.inventory[k]||0)<cost[k]){showToast(`${names[k]||k}이(가) 부족합니다.`);return false}for(const k in cost)state.inventory[k]-=cost[k];return true}
function advance(n=1){for(let i=0;i<n;i++){state.time+=1;if(state.time>=24){state.time=0;state.day++;say('새로운 하루가 시작되었습니다.')}state.hunger=Math.max(0,state.hunger-1.3);state.thirst=Math.max(0,state.thirst-1.8);state.mood=Math.max(0,state.mood-(state.built.bed?.25:.6));if(state.hunger<20)state.health-=.8;if(state.thirst<20)state.health-=1.3;if(state.mood<15)state.health-=.3;if(state.health<=0){state.health=0;showToast('생존 한계에 도달했습니다. 새로고침 전 저장을 확인하세요.')}}render()}
function renderMeters(){const data=[['❤️','체력',state.health],['🍖','허기',state.hunger],['💧','갈증',state.thirst],['☻','기분',state.mood]];$('meters').innerHTML=data.map(([i,n,v])=>`<div class="meter">${i} ${n} <b>${Math.round(v)}</b><span style="color:#8daeb3">/100</span><div class="bar"><div class="fill ${v<25?'low':v<50?'warn':''}" style="width:${v}%"></div></div></div>`).join('');$('dayline').textContent=`DAY ${state.day} · ${String(state.time).padStart(2,'0')}:00 · ${state.day<4?'적응기':state.day<11?'정착기':state.day<31?'생존기':'해상 생활'}`}
function renderInv(){const items=Object.entries(state.inventory).map(([k,v])=>`<div style="display:flex;justify-content:space-between;margin:4px 0"><span>${names[k]||k}</span><b>${v}</b></div>`).join('');const gears=Object.entries(state.gear).map(([k,g])=>`<div style="display:flex;justify-content:space-between;margin:4px 0"><span>${({hammer:'🔨 제작 망치',spear:'🔱 창',wetsuit:'🦺 잠수복'})[k]}</span><b>${g.max>0?`${g.durability}/${g.max}`:'미제작'}</b></div>`).join('');$('inventory').innerHTML=items+`<hr style="border-color:#54727a"><b>장비 내구도</b>`+gears}
function renderLog(){$('log').innerHTML=state.log.map(s=>`<p>› ${s}</p>`).join('')}
function renderActions(){let arr=view==='raft'?[['🪵','뗏목 확장','expand'],['💧','정수기 제작','purifier'],['🔥','그릴 제작','grill'],['🛏️','침대 제작','bed'],['🌱','텃밭 제작','planter'],['🔱','창 제작','spear'],['🦺','잠수복 제작','wetsuit'],['🪛','망치 수리','repairHammer'],['🧰','창 수리','repairSpear'],['🧵','잠수복 수리','repairWetsuit']]:[['🧲','표류물 수집','scavenge'],['🐟','낚시 시도','fish'],['🫧','잠수 탐험','dive'],['🏊','뗏목으로 귀환','return'],['🔱','창으로 상어 견제','defend']];$('actions').innerHTML=arr.map(([i,t,a])=>`<button class="btn" data-act="${a}">${i} ${t}</button>`).join('');$('actions').querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>{action(b.dataset.act);if(['expand','purifier','grill','bed','planter','spear','wetsuit','repairHammer','repairSpear','repairWetsuit'].includes(b.dataset.act))$('sidePanel').classList.remove('open')})}
function render(){renderMeters();renderInv();renderActions();draw()}
function useGear(k,amount=1){const g=state.gear[k];if(!g||g.durability<amount){showToast((({hammer:'제작 망치',spear:'창',wetsuit:'잠수복'})[k]||'장비')+' 내구도가 부족합니다. 수리하거나 다시 제작하세요.');return false}g.durability=Math.max(0,g.durability-amount);if(g.durability===0)say((({hammer:'제작 망치',spear:'창',wetsuit:'잠수복'})[k]||'장비')+'이(가) 파손되었습니다.');return true}
function action(a){if(a==='repairHammer'||a==='repairSpear'||a==='repairWetsuit'){const k=a==='repairHammer'?'hammer':a==='repairSpear'?'spear':'wetsuit';if(state.gear[k].max===0){showToast('먼저 해당 장비를 제작하세요.');return}if(state.gear[k].durability>=state.gear[k].max){showToast('이미 내구도가 가득합니다.');return}const cost={hammer:{wood:1,scrap:1},spear:{wood:1,scrap:1},wetsuit:{plastic:1,rope:1}}[k];if(!spend(cost))return;state.gear[k].durability=state.gear[k].max;say((({hammer:'제작 망치',spear:'창',wetsuit:'잠수복'})[k])+'을(를) 수리했습니다.');advance(1);render()}else if(a==='spear'||a==='wetsuit'){if(state.gear[a].max>0){showToast('이미 보유한 장비입니다.');return}const cost=a==='spear'?{wood:2,scrap:1,rope:1}:{plastic:3,rope:2,scrap:1};if(Object.entries(cost).some(([k,v])=>(state.inventory[k]||0)<v)){spend(cost);return}if(!useGear('hammer',1))return;if(!spend(cost))return;state.gear[a]={durability:a==='spear'?10:12,max:a==='spear'?10:12};say(a==='spear'?'창을 제작했습니다. 사용할 때마다 내구도가 감소합니다.':'간이 잠수복을 제작했습니다. 해파리 독 피해를 줄이지만 내구도가 감소합니다.');advance(1);render()}else if(a==='defend'){if(view!=='sea'){showToast('바다뷰에서 사용할 수 있습니다.');return}const sh=threats.shark;if(Math.hypot(player.x-sh.x,player.y-sh.y)>95){showToast('상어가 충분히 가까이 있지 않습니다.');return}if(state.gear.spear.max===0){showToast('창이 없습니다. 창을 제작해야 상어를 견제할 수 있습니다.');return}if(!useGear('spear',1))return;sh.x=player.x<400?player.x+125:player.x-125;sh.y=Math.max(40,Math.min(460,player.y+(Math.random()>.5?85:-85)));sh.cooldown=12;say('창을 휘둘러 상어를 잠시 쫓아냈습니다.');advance(1);render()}else if(a==='expand'){if((state.inventory.wood||0)<4||(state.inventory.rope||0)<1){spend({wood:4,rope:1});return}if(!useGear('hammer',2))return;if(!spend({wood:4,rope:1}))return;raftSize=Math.min(3,raftSize+1);say('뗏목을 확장했습니다. 생활 공간이 넓어졌습니다!');advance(2)}else if(['purifier','grill','bed','planter'].includes(a)){const costs={purifier:{wood:3,plastic:2},grill:{wood:3,scrap:1},bed:{wood:4,rope:1},planter:{wood:3,plastic:1}};if(state.built[a]){showToast('이미 건설했습니다.');return}if(Object.entries(costs[a]).some(([k,v])=>(state.inventory[k]||0)<v)){spend(costs[a]);return}if(!useGear('hammer',1))return;if(!spend(costs[a]))return;state.built[a]=true;say(({purifier:'정수기를 만들었습니다. 이제 바닷물을 정화할 수 있습니다.',grill:'그릴을 만들었습니다. 생선을 요리할 수 있습니다.',bed:'침대를 만들었습니다. 휴식 효율이 좋아집니다.',planter:'텃밭을 만들었습니다. 작은 녹색 공간이 생겼습니다.'})[a]);advance(1)}else if(a==='scavenge'){if(view!=='sea'){showToast('바다뷰로 이동해 주세요.');return}const d=debris.filter(d=>!d.taken).sort((a,b)=>Math.hypot(player.x-a.x,player.y-a.y)-Math.hypot(player.x-b.x,player.y-b.y))[0];if(!d||Math.hypot(player.x-d.x,player.y-d.y)>62){showToast('수집할 물품이 가까이 없습니다. 화면에 표시된 물품 쪽으로 이동하세요.');return}d.taken=true;add(d.k,d.n);say(`${itemInfo[d.k].label} ${d.n}개를 수집했습니다.`);advance(1);render()}else if(a==='fish'){if(view==='raft'){showToast('바다뷰에서 낚시할 수 있습니다.');return}add('fish',1);say('작은 물고기를 한 마리 잡았습니다.');advance(2)}else if(a==='dive'){if(view!=='sea'){showToast('바다뷰에서만 잠수할 수 있습니다.');return}if(state.thirst<25||state.health<30){showToast('상태가 좋지 않아 잠수하기 어렵습니다.');return}add('scrap',1);if(Math.random()>.55)add('plastic',1);say('해저 잔해에서 쓸 만한 부품을 발견했습니다.');state.thirst=Math.max(0,state.thirst-8);advance(2)}else if(a==='return'){view='raft';player={x:400,y:270};say('로프를 따라 뗏목으로 돌아왔습니다.');setViewUI();render()}}
function setView(v){view=v;player=v==='raft'?{x:400,y:270}:{x:400,y:350};setViewUI();render()}function setViewUI(){$('raftTab').classList.toggle('primary',view==='raft');$('seaTab').classList.toggle('primary',view==='sea');$('viewtitle').textContent=view==='raft'?'🪵 뗏목 생활':'🌊 바다 탐험';$('viewhint').textContent=view==='raft'?'이동하며 시설과 상호작용하고, 뗏목을 나만의 해상 저택으로 키우세요.':'로프로 뗏목과 연결된 채 표류물과 해저 자원을 찾으세요. 상어는 추적하고 범고래는 경고 후 돌진합니다.';$('viewToggle').textContent=view==='raft'?'🌊 바다로':'🪵 뗏목으로';}
function rect(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h))}function text(t,x,y,c='#fff1ce',size=12){ctx.fillStyle=c;ctx.font=`bold ${size}px monospace`;ctx.fillText(t,x,y)}
function drawSeaCreature(x,y,type,dir=1){
  // 작은 픽셀 실루엣과 방향 표시
  ctx.save();
  if(type==='shark'){
    rect(x-24,y-5,45,11,'#294b5b');rect(x-7,y-12,15,8,'#294b5b');rect(x+16,y-1,15,5,'#294b5b');rect(x-18,y-2,4,3,'#c7e4df');rect(x-2,y+5,12,5,'#294b5b');
  }else{
    rect(x-28,y-7,48,15,'#172d3a');rect(x-15,y-12,22,8,'#172d3a');rect(x+15,y-2,17,7,'#172d3a');rect(x-18,y-4,10,4,'#f2f3e8');rect(x-2,y-4,8,4,'#f2f3e8');rect(x-7,y+7,12,5,'#172d3a');
  }
  ctx.restore();
}
function draw(){const w=800,h=500;ctx.clearRect(0,0,w,h);tick++;
// animated pixel ocean
for(let y=0;y<h;y+=20)for(let x=0;x<w;x+=28){let wave=Math.sin((x*0.03+y*.04+tick*.035))*2;rect(x+wave,y,18,2,((x/28+y/20|0)%3===0)?'#3295a5':'#258899');rect(x+10-wave,y+8,7,2,'#50adba')}
if(view==='raft'){let rw=350+(raftSize-1)*90,rh=240+(raftSize-1)*55,x=(w-rw)/2,y=(h-rh)/2; // shadow and planks

// 독성 해파리: 천천히 표류하며 접촉 시 독 상태 부여
const jelly=threats.jelly;jelly.x=430+Math.sin(tick*.018)*115;jelly.y=235+Math.cos(tick*.014)*95;let jx=jelly.x,jy=jelly.y;rect(jx,jy,22,13,'#9c65c8');rect(jx+3,jy-4,16,6,'#f0a9e7');for(let i=0;i<4;i++){rect(jx+3+i*5,jy+12,2,12,'#dba2e9');rect(jx+2+i*5,jy+23,1,5,'#e6b9f1')}text('☠ 독성 해파리',jx-28,jy-12,'#f4d8ff',9);const jd=Math.hypot(player.x-jx-11,player.y-jy-10);if(jd<27&&jelly.cooldown<=0){const suit=state.gear.wetsuit.max>0&&state.gear.wetsuit.durability>0;if(suit)useGear('wetsuit',1);state.poison=suit?2:5;jelly.cooldown=24;state.health=Math.max(0,state.health-(suit?3:8));state.mood=Math.max(0,state.mood-4);dangerFlash=7;say(suit?'잠수복이 해파리 독을 막아 피해를 줄였습니다. 잠수복 내구도가 감소했습니다.':'독성 해파리에 쏘였습니다! 잠시 동안 독 피해가 지속됩니다.');}if(jelly.cooldown>0)jelly.cooldown--;if(state.poison>0&&tick%30===0){state.health=Math.max(0,state.health-(state.gear.wetsuit.max>0&&state.gear.wetsuit.durability>0?0.5:2));state.poison--;showToast(`해파리 독이 퍼지고 있습니다. 남은 단계: ${state.poison}`)}
// 상어: 수영 중인 플레이어를 천천히 추적
if(view==='sea'){
  const sh=threats.shark; const sd=Math.hypot(player.x-sh.x,player.y-sh.y);
  if(sd>1){sh.x+=(player.x-sh.x)/sd*.72;sh.y+=(player.y-sh.y)/sd*.72;}
  drawSeaCreature(sh.x,sh.y,'shark',sh.x<player.x?1:-1);
  if(sd<31 && sh.cooldown<=0){if(state.gear.spear.max>0&&state.gear.spear.durability>0){useGear('spear',1);state.health=Math.max(0,state.health-5);sh.cooldown=12;say('창으로 상어의 공격을 막아냈지만 약간 다쳤습니다. 창 내구도가 감소했습니다.');}else{state.health=Math.max(0,state.health-13);state.mood=Math.max(0,state.mood-5);sh.cooldown=9;dangerFlash=10;say('상어에게 물렸습니다! 창을 제작하거나 뗏목으로 귀환하세요.');}}
  if(sh.cooldown>0)sh.cooldown--;
  // 범고래는 일정 확률로 출현하며, 잠시 경고한 뒤 빠르게 돌진
  hazardClock++;
  if(!threats.orca.active && hazardClock%420===0){threats.orca.active=true;threats.orca.x=player.x<400?700:100;threats.orca.y=player.y<250?420:70;threats.orca.windup=0;say('먼 곳에서 범고래가 나타났습니다! 주변을 살피고 뗏목 쪽으로 이동하세요.');}
  const oc=threats.orca;
  if(oc.active){const od=Math.hypot(player.x-oc.x,player.y-oc.y);if(oc.windup<35){oc.windup++;if(oc.windup===1)showToast('⚠ 범고래가 돌진을 준비합니다!');}else if(od>1){oc.x+=(player.x-oc.x)/od*2.5;oc.y+=(player.y-oc.y)/od*2.5;}
    drawSeaCreature(oc.x,oc.y,'orca',oc.x<player.x?1:-1);
    if(od<34){state.health=Math.max(0,state.health-28);state.mood=Math.max(0,state.mood-12);oc.active=false;dangerFlash=15;say('범고래의 돌진에 휩쓸렸습니다! 큰 피해를 입었습니다.');}
    else if(oc.windup>110){oc.active=false;say('범고래가 깊은 바다로 사라졌습니다.');}

let px=player.x,py=player.y;rect(px-7,py-5,14,13,'#e9b88b');rect(px-7,py-11,14,7,'#5a3828');rect(px-10,py+7,9,4,'#e9b88b');rect(px+2,py+7,9,4,'#e9b88b');ctx.strokeStyle='#9ce4e4';ctx.lineWidth=2;ctx.beginPath();ctx.arc(px,py+5,18+(tick%20),0,Math.PI*2);ctx.stroke();text('수영 중',px-20,py-18,'#fff1ce',10);text('표류물을 찾아보세요 · 가까이 다가가 수집',210,460,'#fff1ce',12);const nearby=debris.find(d=>!d.taken&&Math.hypot(player.x-d.x,player.y-d.y)<62);if(nearby){rect(250,430,300,24,'#092b35eF');text(`수집 가능: ${itemInfo[nearby.k].label} ×${nearby.n}  [주변 수집]`,260,446,'#ffe4a3',11)}}
}
function move(dx,dy){if(state.health<=0){showToast('생존 한계에 도달했습니다.');return}player.x=Math.max(30,Math.min(770,player.x+dx));player.y=Math.max(30,Math.min(470,player.y+dy));if(view==='raft'){player.x=Math.max(210,Math.min(590,player.x));player.y=Math.max(130,Math.min(370,player.y))}else{state.hunger=Math.max(0,state.hunger-0.8);state.thirst=Math.max(0,state.thirst-1.4);state.mood=Math.max(0,state.mood-0.45);advance(1);sayStatusWarning();if(state.health<=0)showToast('생존 한계에 도달했습니다.');}draw();renderMeters()}
function sayStatusWarning(){if(state.thirst<20||state.hunger<20||state.mood<15){const msg=state.thirst<20?'갈증이 심합니다!':state.hunger<20?'배가 고픕니다!':'고립감이 깊어집니다.';showToast(msg)}}
document.addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(['arrowup','w'].includes(k))move(0,-14);else if(['arrowdown','s'].includes(k))move(0,14);else if(['arrowleft','a'].includes(k))move(-14,0);else if(['arrowright','d'].includes(k))move(14,0);else if(k==='e')action(view==='raft'?'expand':'scavenge')});$('touchpad').querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{const d=b.dataset.move;move(d==='left'?-14:d==='right'?14:0,d==='up'?-14:d==='down'?14:0)}));
$('raftTab').onclick=()=>setView('raft');$('seaTab').onclick=()=>setView('sea');$('viewToggle').onclick=()=>setView(view==='raft'?'sea':'raft');$('menuToggle').onclick=()=>{$('sidePanel').classList.toggle('open')};$('eatBtn').onclick=()=>{if(state.inventory.food>0){state.inventory.food--;state.hunger=Math.min(100,state.hunger+35)}else if(state.inventory.fish>0){state.inventory.fish--;state.hunger=Math.min(100,state.hunger+20);say('생선을 먹었습니다. 그릴이 있으면 요리할 수 있어요.')}else{showToast('먹을 것이 없습니다. 바다에서 낚시해 보세요.');return}advance(1);render()};$('drinkBtn').onclick=()=>{if(state.inventory.water>0){state.inventory.water--;state.thirst=Math.min(100,state.thirst+35);say('깨끗한 물을 마셨습니다.')}else if(state.built.purifier&&spend({plastic:1})){add('water',1);state.inventory.water--;state.thirst=Math.min(100,state.thirst+35);say('정수기로 물을 만들어 마셨습니다.')}else{showToast('깨끗한 물이 없습니다. 정수기를 만들거나 보급품을 찾아보세요.');return}advance(1);render()};$('restBtn').onclick=()=>{state.mood=Math.min(100,state.mood+20);state.health=Math.min(100,state.health+(state.built.bed?15:5));say(state.built.bed?'침대에서 쉬었습니다. 몸과 마음이 회복됩니다.':'잠시 몸을 쉬었습니다. 침대가 있으면 더 효과적입니다.');advance(2);render()};$('collectBtn').onclick=()=>{if(view==='sea')action('scavenge');else{setView('sea');showToast('표류물 가까이 이동한 뒤 수집하세요.')}};$('buildBtn').onclick=()=>{if(view==='sea'){showToast('뗏목으로 돌아와 건설하세요.');return}$('sidePanel').classList.add('open');renderActions();showToast('팝업 메뉴에서 시설을 선택하세요.')};$('saveBtn').onclick=()=>{localStorage.setItem('oceanDriftSave',JSON.stringify({state,view,raftSize,player}));say('진행 상황을 이 기기에 저장했습니다.')};
function load(){try{const raw=localStorage.getItem('oceanDriftSave');if(raw){const d=JSON.parse(raw);Object.assign(state,d.state);state.gear=Object.assign({hammer:{durability:12,max:12},spear:{durability:0,max:0},wetsuit:{durability:0,max:0}},state.gear||{});for(const k of ['hammer','spear','wetsuit']){if(typeof state.gear[k]==='boolean')state.gear[k]={durability:state.gear[k]?10:0,max:state.gear[k]?(k==='wetsuit'?12:10):0};else state.gear[k]=Object.assign({durability:0,max:k==='hammer'?12:0},state.gear[k]||{});}state.poison=state.poison||0;view=d.view||'raft';raftSize=d.raftSize||1;player=d.player||player;setViewUI();say('저장된 표류일지를 불러왔습니다.')}}catch(e){console.warn('save load failed',e)}}
// first-run story and gentle survival tutorial
load();if(!state.log.length){state.log.push('모리셔스로 가던 여객 항공기가 추락했다.');state.log.push('정신을 차리고 보니 바다 한가운데 통나무 더미 위였다.');state.log.push('살아남으려면 물과 식량, 안전한 잠자리가 필요하다.');renderLog()}render();
